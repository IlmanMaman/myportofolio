<button type="button" 
        class="button button-danger" 
        popovertarget="delete-edu-{{ edu.id }}"
        aria-label="Hapus {{ edu.institution }}"
        title="Hapus education">
    Hapus Education
</button>

<div id="delete-edu-{{ edu.id }}" class="project-delete-modal" popover="auto" role="dialog">
    <button type="button" class="project-delete-modal_backdrop" popovertarget="delete-edu-{{ edu.id }}" popovertargetaction="hide"></button>
    <div class="project-delete-modal_content">
        <button type="button" class="project-delete-modal_close" popovertarget="delete-edu-{{ edu.id }}" popovertargetaction="hide">x</button>
        <h2>Hapus Education?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ edu.institution }}</strong>?</p>
        
        <form method="post" action="{% url 'main:delete_education' edu.id %}">
            {% csrf_token %}
            <div class="form-group" style="margin: 1rem 0; text-align: left;">
                <label for="secret_code_{{ edu.id }}">Kode Rahasia Admin:</label>
                <input type="password" name="secret_code" id="secret_code_{{ edu.id }}" class="form-control" placeholder="Masukkan kode rahasia" required>
            </div>
            <div class="project-delete-modal_actions">
                <button type="button" class="button button-secondary" popovertarget="delete-edu-{{ edu.id }}" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
